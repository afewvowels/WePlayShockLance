[mod-setting-description]
wp-shock-lance-orb-diameter=How big the plasma orb is. Bigger orbs are easier to hit with a bolt and touch enemies sooner.
wp-shock-lance-orb-range=How far the plasma orb flies before fading out. Bolts always fly at least this far, so long-range combos are possible.
wp-shock-lance-combo-radius=Damage radius of the shock combo. The explosion and crater visuals scale with it.
wp-shock-lance-damage-multiplier=Multiplies all Shock Lance damage: bolts, orbs and shock combos (including damage to players caught in a blast). Stacks with research bonuses.
wp-shock-lance-friendly-fire=When on, shock combo and orb blasts hurt you, your teammates, and your buildings and vehicles caught in them. Enemies are always hurt.
wp-shock-lance-clear-terrain=When on, shock combos destroy trees, rocks and ground decoratives like grass in the blast radius. Nothing drops; trees leave stumps.
