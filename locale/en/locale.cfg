wp-shock-lance=Energy rifle powered by your armor's generators and batteries. Shoot to fire a glowing bolt. Right-click (alt fire) for a slow plasma orb. Hit the orb with a bolt for a shock combo.\nDrains 100 kW while selected, 1.5 MJ per bolt or orb, and 5 MJ per shock combo.
wp-shock-charge=Internal charge for the Shock Lance.

